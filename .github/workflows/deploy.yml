name: Auto Deploy SaveinCloud

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Install Jelastic CLI
        run: |
          curl -s ftp://ftp.jelastic.com/pub/cli/jelastic-cli-installer.sh | bash

      - name: Deploy (Tudo em Um)
        env:
          J_EMAIL: ${{ secrets.JELASTIC_EMAIL }}
          J_PASSWORD: ${{ secrets.JELASTIC_PASSWORD }}
          J_URL: ${{ secrets.JELASTIC_API_URL }}
          ENV_NAME: ${{ secrets.JELASTIC_ENV_NAME }} 
          MANIFEST: "https://raw.githubusercontent.com/carriel2/jelastic-demo/main/manifest.jps"
          REGION: "vz7"
        run: |
          # 1. Previous Validation (Check if ENV_NAME is set)
          if [ -z "$ENV_NAME" ]; then
            echo "::error::ENV_NAME is not set. Please set the environment variable in GitHub Secrets."
            exit 1
          fi

          echo "Starting Deploy: $ENV_NAME"

          # 2. Authenticating (Generate token and store it for subsequent commands)
          /home/runner/jelastic/users/authentication/signin \
            --login "$J_EMAIL" \
            --password "$J_PASSWORD" \
            --platformUrl "$J_URL" \
            --silent true

          # 3. Validate if environment exists by trying to fetch its info.
          # If the environment doesn't exist, the command will return an error which we can catch.
          INFO=$(/home/runner/jelastic/environment/control/getenvinfo --envName "$ENV_NAME" --silent true)
          
          if echo "$INFO" | grep -q '"result": 0'; then
            # ---------------------------------------------------------
            # Scenario A: Environment exists -> Just update it
            # ---------------------------------------------------------
            echo "Environment Found Updating..."
            
            UPDATE_LOG=$(/home/runner/jelastic/environment/control/execcmdbygroup \
              --envName "$ENV_NAME" \
              --nodeGroup cp \
              --commandList '[{"command": "cd /app/repo && git pull && docker-compose up -d --build", "params": ""}]' \
              --silent true)
            
            echo "$UPDATE_LOG"
            
            # Validate the update command result
            if echo "$UPDATE_LOG" | grep -q '"result": 0'; then
               echo "Update Successful!"
            else
               echo "::error::Update Failed!"
               exit 1
            fi

          else
            # ---------------------------------------------------------
            # Scenario B: Environment NOT found -> Create it from scratch using the JPS manifest
            # ---------------------------------------------------------
            echo "Environment Not Found. Creating New Environment..."
            
            CREATE_LOG=$(/home/runner/jelastic/marketplace/jps/install \
              --jps "$MANIFEST" \
              --envName "$ENV_NAME" \
              --region "$REGION" \
              --settings "{\"jelastic_email\":\"$J_EMAIL\"}" \
              --silent true)
              
            echo "$CREATE_LOG"

            if echo "$CREATE_LOG" | grep -q '"result": 0'; then
               echo "Environment creation Successful!"
            else
               echo "::error::Environment creation Failed!"
               exit 1
            fi
          fi