name: Auto Deploy SaveinCloud

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  ENV_NAME: ${{ secrets.ENV_NAME }}
  REGION: "vz7"
  MANIFEST_URL: "https://raw.githubusercontent.com/carriel2/jelastic-demo/main/manifest.jps"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Install Jelastic CLI
        run: |
          curl -s ftp://ftp.jelastic.com/pub/cli/jelastic-cli-installer.sh | bash
          
      - name: Authenticate
        run: |
          /home/runner/jelastic/users/authentication/signin \
            --login "${{ secrets.JELASTIC_EMAIL }}" \
            --password "${{ secrets.JELASTIC_PASSWORD }}" \
            --platformUrl "${{ secrets.JELASTIC_API_URL }}" \
            --silent true
            
      - name: Debug & Check Environment
        id: check-env
        run: |
          # Remove espaços em branco acidentais da variável
          TARGET_ENV=$(echo "${{ env.ENV_NAME }}" | tr -d ' ')
          echo "🔍 Buscando pelo ambiente: [$TARGET_ENV]"
          
          # Salva o JSON em arquivo para facilitar o debug
          /home/runner/jelastic/environment/control/getenvs --silent true > env_list.json
          
          # Usa JQ para buscar exatamente o envName dentro da lista .infos
          # Retorna o status do ambiente se encontrar (1 = Running)
          STATUS=$(cat env_list.json | jq -r --arg TARGET "$TARGET_ENV" '.infos[] | select(.env.envName == $TARGET) | .env.status')
          
          echo "📄 Status retornado pela API: $STATUS"
          
          if [ "$STATUS" == "1" ]; then
            echo "✅ Ambiente encontrado e está rodando!"
            echo "status=exists" >> $GITHUB_OUTPUT
          elif [ -n "$STATUS" ]; then
             echo "⚠️ Ambiente encontrado, mas status é $STATUS (não está rodando 100%). Tentaremos atualizar mesmo assim."
             echo "status=exists" >> $GITHUB_OUTPUT
          else
            echo "❌ Ambiente NÃO encontrado na lista."
            echo "Debug: Listando os nomes disponíveis na conta para conferência:"
            cat env_list.json | jq -r '.infos[].env.envName'
            echo "status=missing" >> $GITHUB_OUTPUT
          fi

      - name: Create Environment
        if: steps.check-env.outputs.status == 'missing'
        run: |
          echo "🚀 Criando ambiente ${{ env.ENV_NAME }}..."
          /home/runner/jelastic/marketplace/jps/install \
            --jps "${{ env.MANIFEST_URL }}" \
            --envName "${{ env.ENV_NAME }}" \
            --region "${{ env.REGION }}" \
            --settings "{\"jelastic_email\":\"${{ secrets.JELASTIC_EMAIL }}\"}" \
            --silent true

      - name: Update Environment
        if: steps.check-env.outputs.status == 'exists'
        run: |
          echo "🔄 Atualizando ambiente: ${{ env.ENV_NAME }} no nodeGroup: cp"
          
          # Executa os comandos
          RESPONSE=$(/home/runner/jelastic/environment/control/execcmdbygroup \
            --envName "${{ env.ENV_NAME }}" \
            --nodeGroup cp \
            --commandList '[{"command": "cd /app/repo && git pull && docker-compose up -d --build", "params": ""}]')
          
          echo "$RESPONSE"
          
          # Verifica sucesso procurando result: 0 OU validando se não tem "error"
          if echo "$RESPONSE" | grep -q '"result": 0'; then
             echo "✅ Deploy realizado com sucesso!"
          else
             echo "::error::Falha ao executar comandos no ambiente!"
             echo "Detalhe do erro: $RESPONSE"
             exit 1
          fi