name: Auto Deploy SaveinCloud

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Install Jelastic CLI
        run: |
          curl -s ftp://ftp.jelastic.com/pub/cli/jelastic-cli-installer.sh | bash

      - name: Deploy (Tudo em Um)
        env:
          # Mapeando as secrets para variáveis locais do shell
          J_EMAIL: ${{ secrets.JELASTIC_EMAIL }}
          J_PASSWORD: ${{ secrets.JELASTIC_PASSWORD }}
          J_URL: ${{ secrets.JELASTIC_API_URL }}
          ENV_NAME: ${{ secrets.JELASTIC_ENV_NAME }} # Ex: carriel-observability
          MANIFEST: "https://raw.githubusercontent.com/carriel2/jelastic-demo/main/manifest.jps"
          REGION: "vz7"
        run: |
          # 1. Validação Prévia (Pra não rodar cego)
          if [ -z "$ENV_NAME" ]; then
            echo "::error::A variável ENV_NAME está vazia! Verifique a Secret no GitHub."
            exit 1
          fi

          echo "🚀 Iniciando Deploy para: $ENV_NAME"

          # 2. Autenticação (Gera a sessão para este script)
          /home/runner/jelastic/users/authentication/signin \
            --login "$J_EMAIL" \
            --password "$J_PASSWORD" \
            --platformUrl "$J_URL" \
            --silent true

          # 3. Verificação Simples (Existe ou não?)
          # Se o comando retornar "result": 0, o ambiente existe.
          INFO=$(/home/runner/jelastic/environment/control/getenvinfo --envName "$ENV_NAME" --silent true)
          
          if echo "$INFO" | grep -q '"result": 0'; then
            # ---------------------------------------------------------
            # CENÁRIO A: AMBIENTE EXISTE -> FAZ UPDATE
            # ---------------------------------------------------------
            echo "✅ Ambiente encontrado! Atualizando..."
            
            UPDATE_LOG=$(/home/runner/jelastic/environment/control/execcmdbygroup \
              --envName "$ENV_NAME" \
              --nodeGroup cp \
              --commandList '[{"command": "cd /app/repo && git pull && docker-compose up -d --build", "params": ""}]' \
              --silent true)
            
            echo "$UPDATE_LOG"
            
            # Valida se o comando rodou
            if echo "$UPDATE_LOG" | grep -q '"result": 0'; then
               echo "🏆 Update concluído com sucesso!"
            else
               echo "::error::Falha no Update!"
               exit 1
            fi

          else
            # ---------------------------------------------------------
            # CENÁRIO B: AMBIENTE NÃO EXISTE (ou erro) -> CRIA DO ZERO
            # ---------------------------------------------------------
            echo "⚠️ Ambiente não encontrado. Criando..."
            
            CREATE_LOG=$(/home/runner/jelastic/marketplace/jps/install \
              --jps "$MANIFEST" \
              --envName "$ENV_NAME" \
              --region "$REGION" \
              --settings "{\"jelastic_email\":\"$J_EMAIL\"}" \
              --silent true)
              
            echo "$CREATE_LOG"

            if echo "$CREATE_LOG" | grep -q '"result": 0'; then
               echo "🏆 Ambiente criado com sucesso!"
            else
               echo "::error::Falha na Criação!"
               exit 1
            fi
          fi