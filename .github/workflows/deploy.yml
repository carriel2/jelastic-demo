name: Auto Deploy SaveinCloud

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  ENV_NAME: ${{ secrets.ENV_NAME }}
  REGION: "vz7"
  MANIFEST_URL: "https://raw.githubusercontent.com/carriel2/jelastic-demo/main/manifest.jps"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Install Jelastic CLI
        run: |
          curl -s ftp://ftp.jelastic.com/pub/cli/jelastic-cli-installer.sh | bash
          
      - name: Authenticate
        run: |
          /home/runner/jelastic/users/authentication/signin \
            --login "${{ secrets.JELASTIC_EMAIL }}" \
            --password "${{ secrets.JELASTIC_PASSWORD }}" \
            --platformUrl "${{ secrets.JELASTIC_API_URL }}" \
            --silent true
            
      - name: Check Logic (GetEnvInfo)
        id: check-env
        run: |
          # Pergunta diretamente à API se o ambiente existe
          echo "Verificando status do ambiente: ${{ env.ENV_NAME }}..."
          
          RESPONSE=$(/home/runner/jelastic/environment/control/getenvinfo \
            --envName "${{ env.ENV_NAME }}" \
            --silent true)
          
          # Verifica se o result é 0 (Sucesso/Existe)
          RESULT=$(echo "$RESPONSE" | jq '.result')
          
          if [ "$RESULT" == "0" ]; then
            echo "status=exists" >> $GITHUB_OUTPUT
            echo "✅ Ambiente encontrado e acessível!"
          else
            echo "status=missing" >> $GITHUB_OUTPUT
            echo "⚠️ Ambiente não encontrado ou erro de acesso (Result: $RESULT). Tentaremos criar."
            echo "Debug Response: $RESPONSE"
          fi

      - name: Create Environment
        if: steps.check-env.outputs.status == 'missing'
        run: |
          echo "Criando ambiente ${{ env.ENV_NAME }}..."
          /home/runner/jelastic/marketplace/jps/install \
            --jps "${{ env.MANIFEST_URL }}" \
            --envName "${{ env.ENV_NAME }}" \
            --region "${{ env.REGION }}" \
            --settings "{\"jelastic_email\":\"${{ secrets.JELASTIC_EMAIL }}\"}" \
            --silent true

      - name: Update Environment
        if: steps.check-env.outputs.status == 'exists'
        run: |
          echo "Atualizando ambiente ${{ env.ENV_NAME }}..."
          
          RESPONSE=$(/home/runner/jelastic/environment/control/execcmdbygroup \
            --envName "${{ env.ENV_NAME }}" \
            --nodeGroup cp \
            --commandList '[{"command": "cd /app/repo && git pull && docker-compose up -d --build", "params": ""}]')
          
          echo "$RESPONSE"
          
          if echo "$RESPONSE" | grep -q '"result": 0'; then
             echo "✅ Deploy realizado com sucesso!"
          else
             echo "::error::Falha ao executar comandos no ambiente!"
             exit 1
          fi