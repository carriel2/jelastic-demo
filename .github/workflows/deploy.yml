name: Auto Deploy SaveinCloud

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  ENV_NAME: ${{ secrets.JELASTIC_ENV_NAME }}
  REGION: "vz7"
  MANIFEST_URL: "https://raw.githubusercontent.com/carriel2/jelastic-demo/main/manifest.jps"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Install Jelastic CLI
        run: |
          curl -s ftp://ftp.jelastic.com/pub/cli/jelastic-cli-installer.sh | bash
          
      - name: Authenticate
        run: |
          /home/runner/jelastic/users/authentication/signin \
            --login "${{ secrets.JELASTIC_EMAIL }}" \
            --token "${{ secrets.JELASTIC_PASSWORD }}" \
            --platformUrl "${{ secrets.JELASTIC_API_URL }}" \
            --silent true
            
      - name: Check Environment (Simples)
        id: check-env
        run: |
          echo "Verificando se o ambiente ${{ env.ENV_NAME }} existe..."
          
          # Consulta apenas o ambiente específico
          RESPONSE=$(/home/runner/jelastic/environment/control/getenvinfo --envName "${{ env.ENV_NAME }}" --silent true)
          
          echo "Resposta da API: $RESPONSE"
          
          # O grep verifica se a resposta contem "result": 0 (que significa SUCESSO na API da Jelastic)
          if echo "$RESPONSE" | grep -q '"result": 0'; then
            echo "action=update" >> $GITHUB_OUTPUT
            echo "✅ Ambiente encontrado! Vamos atualizar."
          else
            echo "action=create" >> $GITHUB_OUTPUT
            echo "⚠️ Ambiente não encontrado (ou erro). Vamos criar."
          fi

      - name: Create Environment
        if: steps.check-env.outputs.action == 'create'
        run: |
          echo "Criando ambiente..."
          /home/runner/jelastic/marketplace/jps/install \
            --jps "${{ env.MANIFEST_URL }}" \
            --envName "${{ env.ENV_NAME }}" \
            --region "${{ env.REGION }}" \
            --settings "{\"jelastic_email\":\"${{ secrets.JELASTIC_EMAIL }}\"}" \
            --silent true

      - name: Update Environment
        if: steps.check-env.outputs.action == 'update'
        run: |
          echo "Atualizando ambiente..."
          
          /home/runner/jelastic/environment/control/execcmdbygroup \
            --envName "${{ env.ENV_NAME }}" \
            --nodeGroup cp \
            --commandList '[{"command": "cd /app/repo && git pull && docker-compose up -d --build", "params": ""}]' \
            --silent true